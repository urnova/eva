[build]
  publish = "."

# Routes principales — exactes
[[redirects]]
  from = "/chat"
  to = "/chat.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/onboarding.html"
  status = 200

# SPA sub-routes (path-based routing) — toutes les sous-URL de chaque page
[[redirects]]
  from = "/chat/cloudworks"
  to = "/chat.html"
  status = 200

[[redirects]]
  from = "/chat/*"
  to = "/chat.html"
  status = 200

[[redirects]]
  from = "/login/*"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/onboarding/*"
  to = "/onboarding.html"
  status = 200

# Page d'accueil
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Sécurité headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

# PWA Manifest — doit être accessible depuis n'importe quelle origine
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = ""
    Cache-Control = "public, max-age=86400"

# Service Workers
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"

[[headers]]
  for = "/chat.html"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Onboarding
[[headers]]
  for = "/onboarding.html"
  [headers.values]
    Access-Control-Allow-Origin = "*"
