<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Puter (E.V.A Desktop)</title>
  <script src="https://js.puter.com/v2/"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@0,400;0,700&display=swap" rel="stylesheet">
  <style>
    body { background: #0b0d17; color: #fff; font-family: 'Space Mono', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .container { max-width: 400px; padding: 30px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
    .btn { background: #00d4ff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; font-family: 'Space Mono'; transition: 0.2s; }
    .btn:hover { background: #92a0ff; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="color:#00d4ff;margin-top:0;">E.V.A DESKTOP</h2>
    <p style="font-size:0.9em;color:#aaa;">Authentification Puter requise pour utiliser ce mod&egrave;le IA sur votre PC.</p>
    <div id="status" style="font-size:0.85em;color:#888;">En attente...</div>
    <button class="btn" id="loginBtn" onclick="doLogin()">SE CONNECTER &Agrave; PUTER</button>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isDesktop = urlParams.get('redirect') === 'eva-desktop';

    async function checkAuth() {
      if (puter.auth.isSignedIn()) {
        const token = puter.auth.getToken();
        document.getElementById('status').innerHTML = '<span style="color:#4ade80;">Connect&eacute; avec succ&egrave;s. Redirection...</span>';
        document.getElementById('loginBtn').style.display = 'none';
        setTimeout(() => {
          window.location.href = 'eva-desktop://puter?token=' + encodeURIComponent(token);
        }, 1000);
      }
    }

    async function doLogin() {
      try {
        await puter.auth.signIn();
        checkAuth();
      } catch(e) {
        document.getElementById('status').innerHTML = '<span style="color:#ff4d6d;">Erreur de connexion.</span>';
      }
    }

    checkAuth();
  </script>
</body>
</html>
