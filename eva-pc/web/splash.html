<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E.V.A - Chargement</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@0,400;0,700&display=swap" rel="stylesheet">
  <!-- Firebase SDK pour vérifier l'état d'auth avant navigation -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/js/core/firebase-config.js"></script>
  <style>
    :root{
      --cyan:#00d4ff;--cyan-glow:rgba(0,212,255,0.28);
      --bg:#111113;--text:#e4e4ef;--text-muted:#88889a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Space Mono',monospace;background:var(--bg);color:var(--text);overflow:hidden;}
    body::before{
      content:'';position:fixed;inset:0;
      background-image:linear-gradient(rgba(0,212,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.015) 1px,transparent 1px);
      background-size:60px 60px;pointer-events:none;z-index:0;
    }
    .bg-orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(100px);z-index:0;}
    .bg-orb-1{width:500px;height:500px;background:rgba(0,212,255,0.06);top:-150px;right:-150px;}
    .bg-orb-2{width:400px;height:400px;background:rgba(167,139,250,0.04);bottom:-150px;left:-100px;}
    
    .splash-container {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh;
      animation: fadeIn 0.8s ease-out;
      -webkit-app-region: drag;
    }
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

    .logo-container {
      position: relative; width: 250px; height: 250px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
    }
    .logo-container img { width: 180px; height: auto; object-fit: contain; z-index: 2; filter: drop-shadow(0 0 20px rgba(0,212,255,0.4)); }
    
    .ring {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      border: 2px solid transparent; border-top-color: var(--cyan);
      animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }
    .ring::before {
      content: ""; position: absolute; top: 8px; right: 8px; bottom: 8px; left: 8px;
      border-radius: 50%; border: 2px solid transparent; border-left-color: rgba(167, 139, 250, 0.8);
      animation: spin 2s linear infinite reverse;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    h1 {
      font-family: 'Orbitron', monospace; font-size: 2.2em; letter-spacing: 6px;
      margin: 0 0 15px 0; color: var(--cyan); text-shadow: 0 0 20px var(--cyan-glow);
    }
    #status-text {
      font-size: 0.9em; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;
      animation: pulseText 2s infinite;
    }
    @keyframes pulseText { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    /* Nuclear drag-region killer when update modal is active */
    body.update-active * { -webkit-app-region: no-drag !important; pointer-events: auto !important; }
    body.update-active #update-modal { display: flex !important; }
  </style>
</head>
<body>
  <div style="-webkit-app-region: drag; position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 99999;"></div>
  
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  
  <!-- Modal de mise à jour -->
  <div id="update-modal" style="display:none; position:fixed; inset:0; background:rgba(17,17,19,0.85); backdrop-filter:blur(10px); z-index:999999; flex-direction:column; justify-content:center; align-items:center; -webkit-app-region:no-drag; pointer-events:auto;">
    <div style="background:rgba(25,25,28,0.95); border:1px solid rgba(0,212,255,0.3); border-radius:12px; padding:30px; width:400px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,0.5);">
      <h2 style="color:var(--cyan); margin-bottom:15px; font-family:'Orbitron', monospace;">Mise à jour requise</h2>
      <p style="color:var(--text-muted); font-size:0.9em; margin-bottom:10px; line-height:1.5;">Une nouvelle version d'E.V.A est disponible. Vous devez l'installer pour continuer à utiliser l'application.</p>
      <div id="update-info" style="color:#aaa; font-size:0.8em; margin-bottom:20px; background:rgba(0,0,0,0.3); padding:10px; border-radius:6px; text-align:left; max-height:150px; overflow-y:auto; display:none; pointer-events:auto; -webkit-app-region:no-drag;"></div>
      
      <div id="update-progress" style="display:none; margin-bottom:20px;">
        <div style="width:100%; height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; margin-bottom:8px;">
          <div id="update-bar" style="width:0%; height:100%; background:var(--cyan); transition:width 0.2s;"></div>
        </div>
        <div id="update-percent" style="font-size:0.8em; color:var(--cyan);">0%</div>
      </div>
      
      <div id="update-countdown" style="display:none; color:var(--text); font-size:1.1em; margin-bottom:20px; font-weight:bold;">
        Fermeture dans <span id="countdown-val">3</span>...
      </div>
      
      <div id="update-actions" style="display:flex; justify-content:center; gap:15px; flex-direction:column; align-items:center;">
        <div style="display:flex; gap:15px;">
          <button id="btn-quit" style="padding:10px 20px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:var(--text); border-radius:6px; cursor:pointer; font-family:'Space Mono', monospace; font-size:0.85em; transition:all 0.2s;">Quitter</button>
          <button id="btn-download" style="padding:10px 24px; border:none; background:var(--cyan); color:#111; border-radius:6px; cursor:pointer; font-weight:bold; font-family:'Space Mono', monospace; font-size:0.85em; transition:all 0.2s; box-shadow:0 0 15px var(--cyan-glow);">Télécharger</button>
        </div>
        <a id="link-manual" href="#" style="color:var(--text-muted); font-size:0.75em; text-decoration:underline; cursor:pointer; margin-top:4px;">Télécharger manuellement sur GitHub</a>
      </div>
    </div>
  </div>

  <div class="splash-container">
    <div class="logo-container">
      <div class="ring"></div>
      <img src="./assets/images/eva-logo.png" alt="EVA Logo">
    </div>
    <h1>E.V.A</h1>
    <div id="status-text">Lancement de l'application...</div>
  </div>

  <script>
    const GITHUB_RELEASES = 'https://github.com/urnova/eva/releases/latest';
    let downloadStarted = false;
    let downloadFallbackTimer = null;

    /* ─── Show update modal: KILL all drag regions via CSS class ─── */
    function showUpdateModal(info) {
      document.body.classList.add('update-active');  // CSS kills ALL -webkit-app-region:drag
      var modal = document.getElementById('update-modal');
      modal.style.display = 'flex';

      if (info && (info.version || info.releaseNotes)) {
        var infoDiv = document.getElementById('update-info');
        infoDiv.style.display = 'block';
        var content = '<b>Version ' + (info.version || 'Disponible') + '</b><br>';
        if (info.releaseNotes) {
          var notes = typeof info.releaseNotes === 'string'
            ? info.releaseNotes
            : (info.releaseNotes[0] ? info.releaseNotes[0].note : '');
          content += '<div style="margin-top:5px;font-size:0.9em;">' + notes + '</div>';
        }
        infoDiv.innerHTML = content;
      }
    }

    /* ─── Télécharger via Electron updater ─── */
    function startUpdate() {
      if (downloadStarted) return;
      downloadStarted = true;
      document.getElementById('update-actions').style.display = 'none';
      document.getElementById('update-progress').style.display = 'block';

      if (window.eva && window.eva.updater) {
        window.eva.updater.startDownload();
      }

      /* Fallback: if no progress after 10s, open GitHub releases in browser */
      downloadFallbackTimer = setTimeout(function() {
        var bar = document.getElementById('update-bar');
        if (bar && parseInt(bar.style.width || '0') < 5) {
          /* No progress detected — offer manual download */
          document.getElementById('update-progress').style.display = 'none';
          document.getElementById('update-actions').style.display = 'flex';
          downloadStarted = false;
          var infoDiv = document.getElementById('update-info');
          infoDiv.style.display = 'block';
          infoDiv.innerHTML = '<b style="color:#f0a500">Téléchargement automatique indisponible.</b><br>'
            + 'Cliquez sur "Télécharger manuellement" ci-dessous.';
        }
      }, 10000);
    }

    /* ─── Wire buttons after DOM ready ─── */
    document.addEventListener('DOMContentLoaded', function() {
      var btnQuit = document.getElementById('btn-quit');
      var btnDl   = document.getElementById('btn-download');
      var linkMan = document.getElementById('link-manual');

      if (btnQuit) {
        btnQuit.addEventListener('click', function(e) {
          e.stopPropagation();
          /* Try IPC force-quit first, then native window.close() as fallback */
          try {
            if (window.eva && window.eva.app && window.eva.app.quit) {
              window.eva.app.quit();
            } else if (window.eva && window.eva.window) {
              window.eva.window.close();
            } else {
              window.close();
            }
          } catch(err) {
            window.close();
          }
        });
      }

      if (btnDl) {
        btnDl.addEventListener('click', function(e) {
          e.stopPropagation();
          startUpdate();
        });
      }

      if (linkMan) {
        linkMan.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          if (window.eva && window.eva.openExternal) {
            window.eva.openExternal(GITHUB_RELEASES);
          } else {
            window.open(GITHUB_RELEASES, '_blank');
          }
        });
      }
    });

    /* ─── IPC events from main process ─── */
    if (window.eva) {
      if (window.eva.onSplashStatus) {
        window.eva.onSplashStatus(function(status) {
          document.getElementById('status-text').innerText = status;
        });
      }
      if (window.eva.onSplashDone) {
        window.eva.onSplashDone(function() {
          /* ─── Auth-aware routing ─── */
          function _navigateAfterAuth() {
            if (typeof firebase !== 'undefined' && firebase.auth) {
              var authTimeout = setTimeout(function() {
                /* Firebase n'a pas répondu en 4s → aller sur login par sécurité */
                window.location.href = 'app-login.html';
              }, 4000);
              firebase.auth().onAuthStateChanged(function(user) {
                clearTimeout(authTimeout);
                if (user) {
                  document.getElementById('status-text').innerText = 'Bienvenue ' + (user.displayName || '') + '…';
                  setTimeout(function() { window.location.href = 'chat.html'; }, 400);
                } else {
                  document.getElementById('status-text').innerText = 'Connexion requise…';
                  setTimeout(function() { window.location.href = 'app-login.html'; }, 400);
                }
              });
            } else {
              /* Firebase non disponible (mode offline/dev) → chat par défaut */
              window.location.href = 'chat.html';
            }
          }
          _navigateAfterAuth();
        });
      }

      if (window.eva.updater) {
        window.eva.updater.onUpdateAvailable(function(info) {
          showUpdateModal(info);
        });

        window.eva.updater.onUpdateProgress(function(prog) {
          if (downloadFallbackTimer) { clearTimeout(downloadFallbackTimer); downloadFallbackTimer = null; }
          if (prog && typeof prog.percent !== 'undefined') {
            var p = Math.round(prog.percent);
            document.getElementById('update-bar').style.width = p + '%';
            document.getElementById('update-percent').innerText = p + '%';
          }
        });

        window.eva.updater.onUpdateDownloaded(function() {
          if (downloadFallbackTimer) { clearTimeout(downloadFallbackTimer); downloadFallbackTimer = null; }
          document.getElementById('update-progress').style.display = 'none';
          document.getElementById('update-countdown').style.display = 'block';
          var count = 3;
          var iv = setInterval(function() {
            count--;
            document.getElementById('countdown-val').innerText = count;
            if (count <= 0) {
              clearInterval(iv);
              window.eva.updater.quitAndInstall();
            }
          }, 1000);
        });

        window.eva.updater.onUpdateError(function(err) {
          if (downloadFallbackTimer) { clearTimeout(downloadFallbackTimer); downloadFallbackTimer = null; }
          document.getElementById('update-progress').style.display = 'none';
          document.getElementById('update-actions').style.display = 'flex';
          downloadStarted = false;
          var infoDiv = document.getElementById('update-info');
          infoDiv.style.display = 'block';
          infoDiv.innerHTML = '<b style="color:#ff6b6b">Erreur de téléchargement</b><br>'
            + '<span style="color:#ff6b6b;font-size:0.8em">' + (err || 'Erreur inconnue') + '</span>';
        });
      }
    }
  </script>
</body>
</html>
