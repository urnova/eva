<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>E.V.A Overlay</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --accent: #00d4ff;
      --accent-soft: rgba(0, 212, 255, 0.22);
      --accent-glow: rgba(0, 212, 255, 0.45);
      --text: #eef2ff;
      --muted: #94a3b8;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      padding: 8px 12px 14px 12px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      -webkit-app-region: drag;
    }

    .pill {
      width: 100%;
      max-width: 376px;
      min-height: 68px;
      background: linear-gradient(145deg, rgba(10, 14, 26, 0.96), rgba(16, 24, 42, 0.96));
      border: 1px solid var(--accent-soft);
      border-radius: 14px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .indicator {
      position: relative;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent-soft);
      animation: spin 1.6s linear infinite;
    }

    .ring-static .ring {
      animation: none;
      border-color: var(--accent);
      opacity: 0.7;
    }

    .orb {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .ring-static .orb {
      animation: none;
    }

    .content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .header-line {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      font-size: 12px;
      line-height: 1.32;
      font-weight: 500;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .btn-stop {
      -webkit-app-region: no-drag;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .btn-stop:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
    }

    .btn-stop svg {
      width: 13px;
      height: 13px;
    }

    /* États */
    .state-cloudworks, .state-action {
      --accent: #00d4ff;
      --accent-soft: rgba(0, 212, 255, 0.35);
      --accent-glow: rgba(0, 212, 255, 0.65);
    }

    .state-approval {
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.45);
      --accent-glow: rgba(245, 158, 11, 0.7);
    }

    .state-done {
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.45);
      --accent-glow: rgba(16, 185, 129, 0.65);
    }

    .state-error {
      --accent: #ef4444;
      --accent-soft: rgba(239, 68, 68, 0.45);
      --accent-glow: rgba(239, 68, 68, 0.65);
    }

    .state-remote {
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.4);
      --accent-glow: rgba(56, 189, 248, 0.65);
    }

    .state-listening {
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.38);
      --accent-glow: rgba(34, 211, 238, 0.65);
    }

    .state-thinking {
      --accent: #fbbf24;
      --accent-soft: rgba(251, 191, 36, 0.4);
      --accent-glow: rgba(251, 191, 36, 0.65);
    }

    .state-speaking {
      --accent: #a855f7;
      --accent-soft: rgba(168, 85, 247, 0.4);
      --accent-glow: rgba(168, 85, 247, 0.65);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.18); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="pill state-cloudworks" id="pill">
    <div class="indicator">
      <div class="ring"></div>
      <div class="orb"></div>
    </div>
    <div class="content">
      <div class="header-line">
        <div class="dot-tag" id="titleText">EVA • CLOUDWORKS</div>
      </div>
      <div class="subtitle" id="subText">Initialisation...</div>
    </div>
    <button class="btn-stop" onclick="closeOverlay()" title="Arrêter / Fermer">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
  </div>

  <script>
    if (window.eva && window.eva.overlay && window.eva.overlay.onSetState) {
      const pill = document.getElementById('pill');
      const titleText = document.getElementById('titleText');
      const subText = document.getElementById('subText');

      window.eva.overlay.onSetState((state, text) => {
        const s = state || 'cloudworks';
        const isStatic = s === 'done' || s === 'error';
        pill.className = 'pill state-' + s + (isStatic ? ' ring-static' : '');

        if (s === 'listening') {
          titleText.textContent = 'EVA • EN ÉCOUTE';
          subText.textContent = text || 'Posez votre question...';
        } else if (s === 'thinking') {
          var raw = (text || '').toLowerCase();
          if (/recherche|search|web|google|bing/.test(raw)) {
            titleText.textContent = 'EVA • RECHERCHE WEB';
          } else if (/outil|cloudworks|système|action/.test(raw)) {
            titleText.textContent = 'EVA • PRÉPARATION OUTILS';
          } else {
            titleText.textContent = 'EVA • ANALYSE';
          }
          subText.textContent = text || 'Traitement en cours...';
        } else if (s === 'speaking') {
          titleText.textContent = 'EVA • PARLE';
          subText.textContent = text || 'Synthèse vocale...';
        } else if (s === 'approval') {
          titleText.textContent = 'CLOUDWORKS • VALIDATION';
          subText.textContent = text || 'Autorisation locale requise sur ce PC';
        } else if (s === 'done') {
          titleText.textContent = 'CLOUDWORKS • TERMINÉ';
          subText.textContent = text || 'Action effectuée avec succès';
        } else if (s === 'error') {
          titleText.textContent = 'CLOUDWORKS • ÉCHEC';
          subText.textContent = text || 'Impossible d’exécuter la tâche';
        } else if (s === 'remote') {
          titleText.textContent = 'CLOUDWORKS • À DISTANCE';
          subText.textContent = text || 'Exécution en cours...';
        } else {
          titleText.textContent = 'CLOUDWORKS • ACTIF';
          subText.textContent = text || 'Exécution locale en cours...';
        }
      });
    }

    function closeOverlay() {
      if (window.eva && window.eva.overlay) {
        if (window.eva.overlay.sendAction) window.eva.overlay.sendAction('cancel');
        if (window.eva.overlay.hide) window.eva.overlay.hide();
      }
    }
  </script>
</body>
</html>
