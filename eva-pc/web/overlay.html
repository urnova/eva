<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>E.V.A Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700&display=swap');

    * { box-sizing: border-box; }
    :root {
      --bg: rgba(10, 13, 24, 0.84);
      --border: rgba(249, 115, 22, 0.36);
      --cyan: #00d4ff;
      --gold: #fbbf24;
      --orange: #f97316;
      --green: #10b981;
      --red: #ef4444;
      --purple: #a855f7;
      --text: #eef2ff;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      user-select: none;
    }

    body {
      padding: 8px 12px 12px 12px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      -webkit-app-region: drag;
    }

    /* Bulle Glassmorphisme double anneau */
    .pill {
      width: 100%;
      max-width: 394px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 11px 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.52), inset 0 0 22px rgba(249, 115, 22, 0.08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .pill::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.45), rgba(255, 255, 255, 0) 50%, rgba(249, 115, 22, 0.22));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .main-row {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
    }

    .indicator-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .core-orb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 12px var(--orange), 0 0 22px var(--orange);
      animation: corePulseFast 1.1s ease-in-out infinite;
      z-index: 2;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(249, 115, 22, 0.55);
      border-top-color: transparent;
      animation: ringSpin 2.6s linear infinite;
    }
    .ring:nth-child(2) {
      border-color: rgba(249, 115, 22, 0.24);
      border-bottom-color: transparent;
      animation: ringSpin 3.8s linear infinite reverse;
      transform: scale(1.22);
    }

    .ring-static .ring { animation: none; border-top-color: inherit; border-bottom-color: inherit; }
    .ring-static .core-orb { animation: none; }

    .text-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-width: 0;
    }

    .title {
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.35);
    }

    .subtitle {
      font-size: 11.5px;
      line-height: 1.3;
      font-weight: 400;
      color: rgba(236, 240, 255, 0.9);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .btn-action {
      -webkit-app-region: no-drag;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-radius: 8px;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--red);
      color: #fecaca;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.32);
    }

    .btn-action svg { width: 14px; height: 14px; }

    .approval-actions {
      -webkit-app-region: no-drag;
      display: none;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .approval-btn {
      -webkit-app-region: no-drag;
      flex: 1;
      border: none;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .approval-btn:hover { filter: brightness(1.1); }
    .approval-btn.approve { background: var(--green); color: #03150e; }
    .approval-btn.deny { background: rgba(239, 68, 68, 0.22); border: 1px solid rgba(239, 68, 68, 0.55); color: #fecaca; }

    /* États dynamiques */
    .state-remote, .state-cloudworks, .state-action, .state-working {
      border-color: rgba(249, 115, 22, 0.42);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.52), inset 0 0 26px rgba(249, 115, 22, 0.12);
    }

    .state-approval .core-orb { background: var(--gold); box-shadow: 0 0 14px var(--gold), 0 0 24px var(--gold); }
    .state-approval .ring { border-color: rgba(251, 191, 36, 0.6); }
    .state-approval .title { color: var(--gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
    .state-approval.pill { border-color: rgba(251, 191, 36, 0.5); box-shadow: 0 10px 32px rgba(0, 0, 0, 0.52), inset 0 0 26px rgba(251, 191, 36, 0.12); }

    .state-done .core-orb { background: var(--green); box-shadow: 0 0 12px var(--green), 0 0 22px var(--green); }
    .state-done .ring { border-color: rgba(16, 185, 129, 0.6); }
    .state-done .title { color: #34d399; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
    .state-done.pill { border-color: rgba(16, 185, 129, 0.45); }

    .state-error .core-orb { background: var(--red); box-shadow: 0 0 12px var(--red), 0 0 22px var(--red); }
    .state-error .ring { border-color: rgba(239, 68, 68, 0.6); }
    .state-error .title { color: #f87171; text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    .state-error.pill { border-color: rgba(239, 68, 68, 0.45); }

    .state-listening .core-orb { background: var(--cyan); box-shadow: 0 0 14px var(--cyan), 0 0 26px var(--cyan); animation: corePulse 1.3s ease-in-out infinite; }
    .state-listening .ring { border-color: rgba(0, 212, 255, 0.6); }
    .state-listening .title { color: var(--cyan); text-shadow: 0 0 10px rgba(0, 212, 255, 0.4); }
    .state-listening.pill { border-color: rgba(0, 212, 255, 0.4); box-shadow: 0 10px 32px rgba(0, 0, 0, 0.52), inset 0 0 26px rgba(0, 212, 255, 0.1); }

    .state-thinking .core-orb { background: var(--gold); box-shadow: 0 0 14px var(--gold), 0 0 26px var(--gold); animation: corePulseFast 0.65s ease-in-out infinite; }
    .state-thinking .ring { border-color: rgba(251, 191, 36, 0.6); }
    .state-thinking .title { color: var(--gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
    .state-thinking.pill { border-color: rgba(251, 191, 36, 0.4); }

    .state-speaking .core-orb { background: var(--purple); box-shadow: 0 0 14px var(--purple), 0 0 26px #9333ea; animation: corePulseFast 0.8s ease-in-out infinite; }
    .state-speaking .ring { border-color: rgba(168, 85, 247, 0.6); }
    .state-speaking .title { color: #c084fc; text-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
    .state-speaking.pill { border-color: rgba(168, 85, 247, 0.4); }

    @keyframes corePulse { 0%, 100% { transform: scale(1); opacity: 0.82; } 50% { transform: scale(1.28); opacity: 1; } }
    @keyframes corePulseFast { 0%, 100% { transform: scale(0.92); opacity: 0.9; } 50% { transform: scale(1.32); opacity: 1; } }
    @keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="pill state-cloudworks" id="pill">
    <div class="main-row">
      <div class="indicator-wrapper">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="core-orb"></div>
      </div>
      <div class="text-container">
        <div class="title" id="titleText">CE PC — CLOUDWORKS</div>
        <div class="subtitle" id="subText">Initialisation...</div>
      </div>
      <button class="btn-action" onclick="closeOverlay()" title="Arrêter / Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
      </button>
    </div>
    <div id="approvalBar" class="approval-actions">
      <button class="approval-btn approve" onclick="respondOverlayApproval(true)">✓ Autoriser</button>
      <button class="approval-btn deny" onclick="respondOverlayApproval(false)">✗ Refuser</button>
    </div>
  </div>

  <script>
    var _currentApprovalTaskId = '';
    if (window.eva && window.eva.overlay && window.eva.overlay.onSetState) {
      const pill = document.getElementById('pill');
      const titleText = document.getElementById('titleText');
      const subText = document.getElementById('subText');
      const approvalBar = document.getElementById('approvalBar');

      window.eva.overlay.onSetState((state, text, data) => {
        const s = state || 'cloudworks';
        const isStatic = s === 'done' || s === 'error';
        pill.className = 'pill state-' + s + (isStatic ? ' ring-static' : '');

        if (approvalBar) {
          if (s === 'approval') {
            _currentApprovalTaskId = (data && data.taskId) ? String(data.taskId) : '';
            approvalBar.style.display = 'flex';
          } else {
            _currentApprovalTaskId = '';
            approvalBar.style.display = 'none';
          }
        }

        if (s === 'listening') {
          titleText.textContent = 'EVA ÉCOUTE...';
          subText.textContent = text || 'Parlez maintenant...';
        } else if (s === 'thinking') {
          var raw = (text || '').toLowerCase();
          if (/recherche|search|web|google|bing/.test(raw)) {
            titleText.textContent = 'EVA — RECHERCHE WEB';
          } else if (/outil|cloudworks|système|action/.test(raw)) {
            titleText.textContent = 'EVA — OUTILS PC';
          } else {
            titleText.textContent = 'EVA RÉFLÉCHIT...';
          }
          subText.textContent = text || 'Traitement en cours...';
        } else if (s === 'speaking') {
          titleText.textContent = 'EVA PARLE';
          subText.textContent = text || 'Synthèse vocale en cours...';
        } else if (s === 'approval') {
          titleText.textContent = 'CLOUDWORKS — VALIDATION';
          subText.textContent = text || 'Autorisation locale requise sur ce PC';
        } else if (s === 'done') {
          titleText.textContent = 'CLOUDWORKS — TERMINÉ';
          subText.textContent = text || 'Action terminée avec succès';
        } else if (s === 'error') {
          titleText.textContent = 'CLOUDWORKS — ÉCHEC';
          subText.textContent = text || 'Impossible d’exécuter la tâche';
        } else if (s === 'remote') {
          titleText.textContent = 'COMMANDE À DISTANCE';
          subText.textContent = text || 'Exécution sur ce PC...';
        } else {
          titleText.textContent = 'CE PC — CLOUDWORKS';
          subText.textContent = text || 'Tâche locale en cours...';
        }
      });
    }

    function respondOverlayApproval(approved) {
      if (window.eva && window.eva.overlay && window.eva.overlay.sendAction) {
        window.eva.overlay.sendAction(approved ? 'approve' : 'deny', _currentApprovalTaskId);
      }
      var bar = document.getElementById('approvalBar');
      if (bar) bar.style.display = 'none';
    }

    function closeOverlay() {
      if (window.eva && window.eva.overlay) {
        if (window.eva.overlay.sendAction) window.eva.overlay.sendAction('cancel');
        if (window.eva.overlay.hide) window.eva.overlay.hide();
      }
    }
  </script>
</body>
</html>
