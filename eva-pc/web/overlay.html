<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>E.V.A Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700&display=swap');
    
    :root {
      --bg: rgba(12, 14, 20, 0.6);
      --border: rgba(0, 212, 255, 0.25);
      --cyan: #00d4ff;
      --pink: #ff4d6d;
      --gold: #ffd700;
      --text: #e4e4ef;
    }
    
    body {
      margin: 0;
      padding: 15px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: transparent;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      -webkit-app-region: drag;
      user-select: none;
    }
    
    /* Premium Glassmorphism Container */
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 212, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    /* Animated Border Glow */
    .pill::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(0,212,255,0.4), rgba(255,255,255,0) 50%, rgba(255,77,109,0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Core Indicator / Avatar */
    .indicator-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .core-orb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan);
      animation: corePulse 2s ease-in-out infinite;
      z-index: 2;
    }
    
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(0, 212, 255, 0.5);
      animation: ringSpin 3s linear infinite;
    }
    .ring:nth-child(2) {
      border-color: rgba(0, 212, 255, 0.2);
      animation: ringSpin 4s linear infinite reverse;
      transform: scale(1.2);
    }

    .text-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-right: 15px;
      flex: 1;
      min-width: 140px;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 3px;
      text-shadow: 0 0 10px rgba(0,212,255,0.3);
    }

    .subtitle {
      font-size: 11px;
      font-weight: 400;
      color: rgba(228, 228, 239, 0.85);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* Disconnect Button */
    .btn-action {
      -webkit-app-region: no-drag;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover {
      background: rgba(255, 77, 109, 0.15);
      border-color: var(--pink);
      color: var(--pink);
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
    }
    
    .btn-action svg { width: 14px; height: 14px; }

    /* Dynamic States */
    /* CloudWorks / Remote State */
    .state-remote .core-orb { background: var(--pink); box-shadow: 0 0 12px var(--pink), 0 0 24px var(--pink); animation: corePulseFast 1s ease-in-out infinite; }
    .state-remote .ring { border-color: rgba(255, 77, 109, 0.5); }
    .state-remote .title { color: var(--pink); text-shadow: 0 0 10px rgba(255,77,109,0.3); }
    .state-remote.pill { border-color: rgba(255, 77, 109, 0.25); box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(255, 77, 109, 0.05); }

    /* Thinking State */
    .state-thinking .core-orb { background: var(--gold); box-shadow: 0 0 12px var(--gold), 0 0 24px var(--gold); animation: corePulseFast 0.6s ease-in-out infinite; }
    .state-thinking .ring { border-color: rgba(255, 215, 0, 0.5); }
    .state-thinking .title { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.3); }
    .state-thinking.pill { border-color: rgba(255, 215, 0, 0.25); box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(255, 215, 0, 0.05); }

    /* Animations */
    @keyframes corePulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } }
    @keyframes corePulseFast { 0%, 100% { transform: scale(0.9); opacity: 0.9; } 50% { transform: scale(1.4); opacity: 1; } }
    @keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <div class="pill state-listening" id="pill">
    <div class="indicator-wrapper">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="core-orb"></div>
    </div>
    
    <div class="text-container">
      <div class="title" id="titleText">E.V.A - EN ÉCOUTE</div>
      <div class="subtitle" id="subText">Système actif</div>
    </div>
    
    <button class="btn-action" onclick="closeOverlay()" title="Interrompre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
    </button>
  </div>

  <script>
    if (window.eva && window.eva.overlay) {
      const pill = document.getElementById('pill');
      const titleText = document.getElementById('titleText');
      const subText = document.getElementById('subText');

      if (window.eva.overlay.onSetState) {
        window.eva.overlay.onSetState((state, text) => {
          pill.className = 'pill state-' + state;
          
          if (state === 'cloudworks' || state === 'action') {
            titleText.textContent = 'CE PC — ACTIF';
            subText.textContent = text || 'Tâche locale en cours...';
            pill.className = 'pill state-remote';
          } else if (state === 'remote') {
            titleText.textContent = 'COMMANDE À DISTANCE';
            subText.textContent = text || 'Exécution depuis un autre appareil...';
            pill.className = 'pill state-remote';
          } else if (state === 'thinking') {
            titleText.textContent = 'ANALYSE...';
            subText.textContent = text || 'Traitement cognitif...';
          } else if (state === 'speaking') {
            titleText.textContent = 'E.V.A PARLE';
            subText.textContent = text || 'Synthèse vocale en cours...';
            pill.className = 'pill state-listening'; 
          } else {
            titleText.textContent = 'E.V.A - EN ÉCOUTE';
            subText.textContent = text || 'Prête.';
          }
        });
      }
    }

    function closeOverlay() {
      if (window.eva) {
        if (window.eva.overlay && window.eva.overlay.sendAction) {
          window.eva.overlay.sendAction('cancel');
        }
        if (window.eva.overlay && window.eva.overlay.hide) {
          window.eva.overlay.hide();
        }
      }
    }

    /* ══════════════════════════════════════════
       WAKE WORD — Tourne dans l'overlay (toujours visible → non throttlé)
       Détecte "EVA" ou "Hey EVA" même quand la fenêtre principale est cachée
    ══════════════════════════════════════════ */
    (function initOverlayWakeWord() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;

      var wakeWords = ['eva', 'éva', 'hey eva', 'e.v.a', 'eh va'];
      var recognition = null;
      var isListening = false;
      var state = 'idle';
      var buffer = '';
      var restartTimer = null;

      function hasWake(t) {
        t = t.toLowerCase().trim();
        return wakeWords.some(function(w) { return t.includes(w); });
      }
      function extractCmd(t) {
        t = t.toLowerCase();
        var bestIdx = -1, bestLen = 0;
        wakeWords.forEach(function(w) {
          var idx = t.indexOf(w);
          if (idx !== -1 && w.length > bestLen) { bestIdx = idx; bestLen = w.length; }
        });
        if (bestIdx === -1) return null;
        return t.substring(bestIdx + bestLen).replace(/^[\s,\.!?]+/, '').trim() || null;
      }
      function fireCommand(cmd) {
        if (!cmd || !cmd.trim()) return;
        if (window.eva && window.eva.overlay && window.eva.overlay.sendAction) {
          window.eva.overlay.sendAction('wakeword', cmd.trim());
        }
      }
      function scheduleRestart(ms) {
        if (restartTimer) clearTimeout(restartTimer);
        restartTimer = setTimeout(function() {
          if (isListening && recognition) try { recognition.start(); } catch(e) {}
        }, ms || 400);
      }

      function buildRecognition() {
        var r = new SR();
        r.lang = 'fr-FR';
        r.continuous = true;
        r.interimResults = true;
        r.maxAlternatives = 1;
        r.onresult = function(event) {
          for (var i = event.resultIndex; i < event.results.length; i++) {
            var tr = event.results[i][0].transcript;
            var final = event.results[i].isFinal;
            if (state === 'idle') {
              if (hasWake(tr)) {
                if (final) {
                  var cmd = extractCmd(tr);
                  if (cmd && cmd.length > 1) { fireCommand(cmd); }
                  else { state = 'triggered'; buffer = ''; }
                }
              }
            } else if (state === 'triggered') {
              buffer = tr;
              if (final && buffer.trim().length > 1) {
                var fc = buffer.trim(); state = 'idle'; buffer = '';
                fireCommand(fc);
              }
            }
          }
        };
        r.onend = function() {
          if (state === 'triggered' && buffer.trim().length > 1) {
            var c = buffer.trim(); state = 'idle'; buffer = ''; fireCommand(c); return;
          }
          state = 'idle'; buffer = '';
          if (isListening) scheduleRestart(400);
        };
        r.onerror = function(e) {
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            isListening = false; return;
          }
          state = 'idle'; buffer = '';
          if (isListening) scheduleRestart(1200);
        };
        return r;
      }

      // Démarrer uniquement si le wake word est activé dans le store
      async function startIfEnabled() {
        if (window.eva && window.eva.store) {
          try {
            var cfg = await window.eva.store.get('eva_config');
            var config = typeof cfg === 'string' ? JSON.parse(cfg || '{}') : (cfg || {});
            if (!config.wakeWordEnabled) return; // Wake word désactivé → ne pas démarrer
          } catch(e) {}
        }
        if (isListening) return;
        isListening = true;
        recognition = buildRecognition();
        try { recognition.start(); } catch(e) { scheduleRestart(800); }
      }

      // Écouter les changements de config pour démarrer/arrêter
      if (window.eva && window.eva.overlay && window.eva.overlay.onSetState) {
        window.eva.overlay.onSetState(function(st) {
          if (st === 'wake-word-on') { startIfEnabled(); }
          if (st === 'wake-word-off' && recognition) {
            isListening = false;
            try { recognition.stop(); } catch(e) {}
            recognition = null;
          }
        });
      }

      // Auto-démarrer au chargement de l'overlay
      setTimeout(startIfEnabled, 2000);
    })();
  </script>
</body>
</html>
