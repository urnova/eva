<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVA Overlay</title>
  <style>
    :root {
      --cyan: #06b6d4;
      --purple: #a855f7;
      --bg: rgba(15, 15, 30, 0.85);
      --border: rgba(123, 139, 245, 0.2);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      padding-right: 15px;
      -webkit-app-region: drag; /* Permet de drag la fenêtre si besoin */
    }

    #overlay-container {
      width: 300px;
      height: 80px;
      background: var(--bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(123, 139, 245, 0.05);
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      position: relative;
      overflow: hidden;
      -webkit-app-region: no-drag; /* Empêcher le drag sur le container pour les clics */
    }

    #overlay-container.show {
      transform: translateX(0);
      opacity: 1;
    }

    /* Lueur de fond animée */
    .glow-bg {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.15) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.5s;
      z-index: 0;
      pointer-events: none;
    }

    .state-listening .glow-bg { background: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.15) 0%, transparent 60%); opacity: 1; animation: pulseGlow 2s infinite alternate; }
    .state-thinking .glow-bg { background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 60%); opacity: 1; animation: spinGlow 4s linear infinite; }
    .state-speaking .glow-bg { background: radial-gradient(circle at 50% 50%, rgba(74, 222, 128, 0.15) 0%, transparent 60%); opacity: 1; animation: pulseGlow 1s infinite alternate; }
    .state-cloudworks .glow-bg { background: radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.15) 0%, transparent 60%); opacity: 1; }

    @keyframes pulseGlow { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }
    @keyframes spinGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Icône animée */
    .icon-container {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 15px;
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .icon {
      font-size: 20px;
      transition: transform 0.3s;
    }

    .state-listening .icon { animation: micBounce 1.5s infinite; }
    .state-thinking .icon { animation: spin 2s linear infinite; }
    .state-speaking .icon { animation: pop 0.4s infinite alternate; }

    @keyframes micBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.1); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pop { 0% { transform: scale(0.95); } 100% { transform: scale(1.15); } }

    /* Texte de statut */
    .text-container {
      flex: 1;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .title {
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bouton d'action */
    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 1;
      transition: all 0.2s;
      outline: none;
      margin-left: 10px;
      flex-shrink: 0;
    }

    .action-btn:hover {
      background: rgba(255, 77, 109, 0.2);
      border-color: rgba(255, 77, 109, 0.5);
      color: #ff4d6d;
    }
    
    .action-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
</head>
<body>

  <div id="overlay-container">
    <div class="glow-bg"></div>
    
    <div class="icon-container">
      <span class="icon" id="status-icon">🎙️</span>
    </div>
    
    <div class="text-container">
      <div class="title" id="status-title">Je t'écoute...</div>
      <div class="subtitle" id="status-sub">Dis "Annuler" pour fermer</div>
    </div>
    
    <button class="action-btn" id="cancel-btn" title="Annuler / Arrêter">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const container = document.getElementById('overlay-container');
    const iconEl = document.getElementById('status-icon');
    const titleEl = document.getElementById('status-title');
    const subEl = document.getElementById('status-sub');

    const states = {
      listening: {
        class: 'state-listening',
        icon: '🎙️',
        title: 'Je t\'écoute...',
        sub: 'Dis "Annuler" pour arrêter'
      },
      thinking: {
        class: 'state-thinking',
        icon: '🧠',
        title: 'Réflexion en cours...',
        sub: 'Analyse de votre demande'
      },
      speaking: {
        class: 'state-speaking',
        icon: '🔊',
        title: 'E.V.A parle',
        sub: 'Lecture de la réponse'
      },
      cloudworks: {
        class: 'state-cloudworks',
        icon: '☁️',
        title: 'Action à distance',
        sub: 'CloudWorks prend le contrôle'
      }
    };

    ipcRenderer.on('overlay:setState', (event, stateKey, customText) => {
      const stateObj = states[stateKey];
      if (!stateObj) return;

      container.className = '';
      container.classList.add(stateObj.class);
      container.classList.add('show');

      iconEl.textContent = stateObj.icon;
      titleEl.textContent = stateObj.title;
      subEl.textContent = customText || stateObj.sub;
    });

    document.getElementById('cancel-btn').addEventListener('click', () => {
      ipcRenderer.send('overlay:action', 'cancel');
      container.classList.remove('show');
      setTimeout(() => {
        ipcRenderer.invoke('overlay:hide');
      }, 500);
    });
  </script>
</body>
</html>
